[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.default.lints]
block-timestamp = "allow"

[rpc_endpoints]
arc = "https://rpc.testnet.arc.network"

[etherscan]
arc = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
