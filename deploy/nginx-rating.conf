server {
    listen 80;
    server_name rating-arcagents.poko.blue;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rating-arcagents.poko.blue;

    # Cloudflare origin cert. Two options:
    # 1. Wildcard cert at /etc/ssl/cloudflare/arcagents.poko.blue.{pem,key}
    #    covering *.arcagents.poko.blue — set both paths to that pair.
    # 2. Separate origin cert generated for rating-arcagents.poko.blue —
    #    place at /etc/ssl/cloudflare/rating-arcagents.poko.blue.{pem,key}.
    ssl_certificate /etc/ssl/cloudflare/rating-arcagents.poko.blue.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rating-arcagents.poko.blue.key;

    # Public read-only API — permissive CORS so other apps can consume ratings.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    location / {
        proxy_pass http://localhost:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
